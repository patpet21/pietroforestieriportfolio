name = "pietroforestieriportfolio"
main = "booking-worker.js"
compatibility_date = "2026-10-20"
workers_dev = false
keep_vars = true

[[durable_objects.bindings]]
name = "BOOKING_LOCKS"
class_name = "BookingGate"

[[durable_objects.bindings]]
name = "OAUTH_VAULT"
class_name = "GoogleOAuthVault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BookingGate"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GoogleOAuthVault"]

[vars]
ALLOWED_ORIGINS = "https://pietroforestieri.propertydex.xyz,https://pietroforestieri.netlify.app"
BOOKING_START_HOUR = "9"
BOOKING_END_HOUR = "17"
BOOKING_WEEKDAYS = "1,2,3,4,5"
BOOKING_MIN_NOTICE_HOURS = "24"
BOOKING_WINDOW_DAYS = "45"
# OAuth is connected: queue branded Gmail confirmation and 15-minute reminder for new bookings.
EMAIL_NOTIFICATIONS_ENABLED = "true"

# Booking is disabled until BOOKINGS_ENABLED=true is added in the Cloudflare dashboard.
# Dashboard variables survive redeploys because keep_vars=true.
# Add calendar IDs and service account credentials only in Cloudflare
# Workers & Pages -> Worker -> Settings -> Variables and Secrets.
# Do not commit private keys or a .dev.vars file.

# OAuth setup secrets must be configured only in Cloudflare dashboard:
# GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, OAUTH_SETUP_TOKEN.
# BOOKING_ORGANIZER_EMAIL is a regular environment variable.
# GOOGLE_OAUTH_REFRESH_TOKEN is not needed: OAuth vault encrypts and stores it.
# EMAIL_NOTIFICATIONS_ENABLED=true activates branded mail for NEW bookings.\n# Validate delivery with an actual controlled reservation; existing bookings are not retroactively queued.
